# Build production-ready SkillPulse LMS Free plugin and deploy to production branch.
# The production branch contains the clean, minified plugin ready for WordPress.org distribution.

name: Build Production Zip

on:
  push:
    branches:
      - release

  # Enable manual trigger.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    # Grant write permissions to push to production branch.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Packages
        run: sudo apt-get install gettext zip -y

      - name: Install PHP
        run: |
          sudo apt-get install software-properties-common -y
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt install php7.4 php7.4-dom php7.4-curl php7.4-mbstring php7.4-xml php7.4-zip -y
          sudo update-alternatives --set php /usr/bin/php7.4
          echo "PHP version: $(php -v | head -1)"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Validate composer.json
        run: composer validate

      - name: Run Build Script
        run: bash ./bin/build.sh

      - name: Verify Build Output
        run: |
          echo "Checking for output files..."
          ls -la ./output/ || echo "Output directory not found!"

          PRODUCT_NAME=$(basename $PWD)
          echo "Product name: $PRODUCT_NAME"

          if [ ! -f ./output/${PRODUCT_NAME}.zip ]; then
            echo "ERROR: ${PRODUCT_NAME}.zip not found!"
            exit 1
          fi

          echo "ZIP file found: ./output/${PRODUCT_NAME}.zip"
          ls -lh ./output/${PRODUCT_NAME}.zip

      - name: Prepare Artifact
        run: |
          PRODUCT_NAME=$(basename $PWD)
          echo "Preparing artifact for: $PRODUCT_NAME"
          mkdir -p ./output/${PRODUCT_NAME}/
          unzip -q ./output/${PRODUCT_NAME}.zip -d ./output/${PRODUCT_NAME}/
          rm ./output/${PRODUCT_NAME}.zip

      - name: Create Final Plugin Zip
        run: |
          PRODUCT_NAME=$(basename $PWD)
          cd output
          zip ${PRODUCT_NAME}.zip ${PRODUCT_NAME} -r
          ls -lh ${PRODUCT_NAME}.zip

      - name: Upload Zip to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-build.zip
          path: output/${{ github.event.repository.name }}.zip
          retention-days: 30
        env:
          CI: true

      # Deploy to production branch.
      - name: Deploy to production branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --all
          git reset --hard HEAD
          git clean -fd

          PRODUCT_NAME=${{ github.event.repository.name }}
          cp output/${PRODUCT_NAME}.zip /tmp/${PRODUCT_NAME}.zip

          # Create or switch to production branch.
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            echo "Production branch exists, checking out..."
            git checkout -B production origin/production
          else
            echo "Production branch does not exist, creating new orphan branch..."
            git checkout --orphan production
            git rm -rf . || true
          fi

          # Clear production branch content (preserve .git directory).
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Extract built plugin files to production branch.
          unzip -q /tmp/${PRODUCT_NAME}.zip

          # Move extracted files to root.
          if [ -d "${PRODUCT_NAME}" ]; then
            echo "Moving files from ${PRODUCT_NAME} directory to root..."
            find ${PRODUCT_NAME} -maxdepth 1 -mindepth 1 ! -name '.*' -exec mv {} . \;
            find ${PRODUCT_NAME} -maxdepth 1 -mindepth 1 -name '.*' ! -name '.' ! -name '..' -exec mv {} . \; 2>/dev/null || true
            rmdir ${PRODUCT_NAME} 2>/dev/null || true
          fi

          git add .

          if ! git diff --cached --exit-code > /dev/null; then
            git commit -m "Deploy production build from ${{ github.ref_name }} - commit ${{ github.sha }}"
            git push origin production
            echo "Successfully deployed to production branch"
          else
            echo "No changes to deploy to production branch"
          fi

        env:
          CI: true
