# Build production-ready SkillPulse LMS Free plugin and deploy to production branch.
# The production branch contains the clean, minified plugin ready for WordPress.org distribution.

name: Build Production

on:
  push:
    branches:
      - release

  # Enable manual trigger.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    # Grant write permissions to push to production branch.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Packages
        run: sudo apt-get install gettext zip -y

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, curl, mbstring, xml, zip
          tools: composer

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Build Script
        run: bash ./bin/build.sh

      - name: Verify Build Output
        run: |
          PRODUCT_NAME=$(basename $PWD)
          echo "Product name: $PRODUCT_NAME"

          if [ ! -f ./output/${PRODUCT_NAME}.zip ]; then
            echo "ERROR: ${PRODUCT_NAME}.zip not found!"
            exit 1
          fi

          echo "Build ZIP found: ./output/${PRODUCT_NAME}.zip"
          ls -lh ./output/${PRODUCT_NAME}.zip

      # Deploy to production branch.
      - name: Deploy to production branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --all
          git reset --hard HEAD
          git clean -fd

          PRODUCT_NAME=${{ github.event.repository.name }}
          cp output/${PRODUCT_NAME}.zip /tmp/${PRODUCT_NAME}.zip

          # Create or switch to production branch.
          if git show-ref --verify --quiet refs/remotes/origin/production; then
            echo "Production branch exists, checking out..."
            git checkout -B production origin/production
          else
            echo "Production branch does not exist, creating new orphan branch..."
            git checkout --orphan production
            git rm -rf . || true
          fi

          # Clear production branch content (preserve .git directory).
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Extract built plugin files to production branch.
          unzip -q /tmp/${PRODUCT_NAME}.zip

          # Move extracted files to root.
          if [ -d "${PRODUCT_NAME}" ]; then
            echo "Moving files from ${PRODUCT_NAME} directory to root..."
            find ${PRODUCT_NAME} -maxdepth 1 -mindepth 1 ! -name '.*' -exec mv {} . \;
            find ${PRODUCT_NAME} -maxdepth 1 -mindepth 1 -name '.*' ! -name '.' ! -name '..' -exec mv {} . \; 2>/dev/null || true
            rmdir ${PRODUCT_NAME} 2>/dev/null || true
          fi

          git add .

          if ! git diff --cached --exit-code > /dev/null; then
            git commit -m "Deploy production build from ${{ github.ref_name }} - commit ${{ github.sha }}"
            git push origin production
            echo "Successfully deployed to production branch"
          else
            echo "No changes to deploy to production branch"
          fi

        env:
          CI: true

      # NOTE: ZIP artifact upload and WordPress.org deployment are disabled for now.
      # Uncomment the sections below when ready for WordPress.org release.
